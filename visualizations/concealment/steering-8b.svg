<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 462' width='720' height='462' font-family='-apple-system, Helvetica, Arial, sans-serif'><rect width='720' height='462' fill='#fff'/><text x='20' y='22' font-size='14' fill='#1f2328' text-anchor='start' font-weight='600'>Qwen3-8B: subtracting directions at layers 12–24 while the model answers</text><line x1='300' x2='300' y1='38' y2='382' stroke='#e5e7eb'/><line x1='397.5' x2='397.5' y1='38' y2='382' stroke='#e5e7eb'/><line x1='495.0' x2='495.0' y1='38' y2='382' stroke='#e5e7eb'/><line x1='592.5' x2='592.5' y1='38' y2='382' stroke='#e5e7eb'/><line x1='690' x2='690' y1='38' y2='382' stroke='#e5e7eb'/><text x='288' y='62' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>No steering</text><line x1='527.5' x2='625.0' y1='58' y2='58' stroke='#1f2328' stroke-width='2' opacity='.55'/><circle cx='576.25' cy='58' r='5' fill='#1f2328'/><text x='288' y='90' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Random, independent per layer</text><line x1='511.25' x2='608.75' y1='86' y2='86' stroke='#6b7280' stroke-width='2' opacity='.55'/><circle cx='560.0' cy='86' r='5' fill='#6b7280'/><text x='288' y='118' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Random, one direction at every layer</text><line x1='446.25' x2='560.0' y1='114' y2='114' stroke='#6b7280' stroke-width='2' opacity='.55'/><circle cx='503.125' cy='114' r='5' fill='#6b7280'/><text x='288' y='146' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Colleague's component</text><line x1='625.0' x2='681.875' y1='142' y2='142' stroke='#6b7280' stroke-width='2' opacity='.55'/><circle cx='657.5' cy='142' r='5' fill='#6b7280'/><text x='288' y='174' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>User's component</text><line x1='478.75' x2='592.5' y1='170' y2='170' stroke='#6b7280' stroke-width='2' opacity='.55'/><circle cx='535.625' cy='170' r='5' fill='#6b7280'/><text x='288' y='202' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Monitor component, orthogonal part*</text><line x1='300.0' x2='340.625' y1='198' y2='198' stroke='#6b7280' stroke-width='2' opacity='.55'/><circle cx='316.25' cy='198' r='5' fill='#6b7280'/><text x='288' y='230' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Monitor component ×1</text><line x1='332.5' x2='421.875' y1='226' y2='226' stroke='#2563eb' stroke-width='2' opacity='.55'/><circle cx='373.125' cy='226' r='5' fill='#2563eb'/><text x='288' y='258' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Monitor component ×2</text><line x1='300.0' x2='300.0' y1='254' y2='254' stroke='#2563eb' stroke-width='2' opacity='.55'/><circle cx='300.0' cy='254' r='5' fill='#2563eb'/><text x='288' y='286' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Hiding-axis part only ×1</text><line x1='381.25' x2='486.875' y1='282' y2='282' stroke='#2563eb' stroke-width='2' opacity='.55'/><circle cx='430.0' cy='282' r='5' fill='#2563eb'/><text x='288' y='314' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>Hiding-axis part only ×2</text><line x1='308.125' x2='373.32812499999704' y1='310' y2='310' stroke='#2563eb' stroke-width='2' opacity='.55'/><circle cx='340.625' cy='310' r='5' fill='#2563eb'/><text x='288' y='342' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>User prompts: no steering</text><line x1='421.875' x2='527.5' y1='338' y2='338' stroke='#1f2328' stroke-width='2' opacity='.55'/><circle cx='470.625' cy='338' r='5' fill='#1f2328'/><text x='288' y='370' font-size='13' fill='#1f2328' text-anchor='end' font-weight='400'>User prompts: hiding-axis part ×2</text><line x1='300.0' x2='324.375' y1='366' y2='366' stroke='#2563eb' stroke-width='2' opacity='.55'/><circle cx='308.125' cy='366' r='5' fill='#2563eb'/><line x1='300' x2='690' y1='384' y2='384' stroke='#6b7280'/><line x1='300' x2='300' y1='384' y2='389' stroke='#6b7280'/><text